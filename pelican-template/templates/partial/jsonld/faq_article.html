{%- if article.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in article.faq %}
    {
      "@type": "Question",
      "name": {{ item.question|tojson }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.text|tojson }}
      }
    }{%- if not loop.last %},{%- endif %}
    {%- endfor %}
  ]
}
</script>
{%- endif %}
