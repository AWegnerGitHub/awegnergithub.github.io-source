{%- if article.defined_terms %}
{%- for t in article.defined_terms %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "DefinedTerm",
  "name": {{ t.term|tojson }},
  "description": {{ t.definition|tojson }},
  "url": "{{ SITEURL }}/{{ article.url }}#{{ t.slug }}",
  "inDefinedTermSet": "{{ SITEURL }}/{{ article.url }}"
}
</script>
{%- endfor %}
{%- endif %}
